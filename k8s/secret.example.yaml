# Скопируй в k8s/secret.yaml (он в .gitignore), впиши пароль приложения Gmail и примени:
#   kubectl apply -f k8s/secret.yaml
# Или без файла:
#   kubectl -n invitation create secret generic invitation-mail \
#     --from-literal=SMTP_USER=arahnik121@gmail.com \
#     --from-literal=SMTP_PASS='xxxx xxxx xxxx xxxx'
apiVersion: v1
kind: Secret
metadata:
  name: invitation-mail
  namespace: invitation
type: Opaque
stringData:
  SMTP_USER: arahnik121@gmail.com
  SMTP_PASS: "xxxx xxxx xxxx xxxx"   # пароль приложения Google, НЕ обычный пароль
  MAIL_TO_HIM: arahnik121@gmail.com
  MAIL_TO_HER: kate.buryleva@gmail.com
